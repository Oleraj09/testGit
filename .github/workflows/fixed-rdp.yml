
name: Fixed-RDP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tailscale-rdp-fixed-node
  cancel-in-progress: false

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      # Restore previous encrypted Tailscale identity
      - name: Restore Tailscale State
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}\tailscale-cache
          key: tailscale-state-${{ github.run_id }}
          restore-keys: |
            tailscale-state-

      # Configure portable Tailscale state
      - name: Configure Tailscale State Policy
        shell: pwsh
        run: |
          $policy = "HKLM:\SOFTWARE\Policies\Tailscale"

          New-Item -Path $policy -Force | Out-Null

          New-ItemProperty `
            -Path $policy `
            -Name EncryptState `
            -PropertyType DWord `
            -Value 0 `
            -Force | Out-Null

          New-Item -ItemType Directory `
            -Path "$env:RUNNER_TEMP\tailscale-cache" `
            -Force | Out-Null

      # Install Tailscale
      - name: Install Tailscale
        shell: pwsh
        run: |
          $url = "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi"
          $installer = "$env:TEMP\tailscale.msi"

          Invoke-WebRequest -Uri $url -OutFile $installer

          $process = Start-Process msiexec.exe `
            -ArgumentList "/i `"$installer`" /quiet /norestart" `
            -Wait -PassThru

          Remove-Item $installer -Force

          if ($process.ExitCode -notin @(0, 3010)) {
            throw "Tailscale installation failed: $($process.ExitCode)"
          }

      # Restore previous Tailscale identity
      - name: Restore Tailscale Identity
        shell: pwsh
        env:
          STATE_KEY: ${{ secrets.TAILSCALE_STATE_KEY }}
        run: |
          $stateDir = "$env:ProgramData\Tailscale"
          $cacheFile = "$env:RUNNER_TEMP\tailscale-cache\tailscale-state.enc"

          New-Item -ItemType Directory -Path $stateDir -Force | Out-Null

          Stop-Service -Name Tailscale -Force -ErrorAction SilentlyContinue

          $candidates = @(
            "$stateDir\tailscaled.state",
            "$stateDir\server-state.conf"
          )

          $stateFile = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $stateFile) {
            $stateFile = $candidates[0]
          }

          if (Test-Path $cacheFile) {

            Write-Host "Previous Tailscale identity found. Restoring..."

            if (-not $env:STATE_KEY) {
              throw "TAILSCALE_STATE_KEY is missing."
            }

            try {
              $key = [Convert]::FromBase64String($env:STATE_KEY)
            }
            catch {
              throw "TAILSCALE_STATE_KEY is not valid Base64."
            }

            if ($key.Length -ne 32) {
              throw "STATE_KEY must decode to exactly 32 bytes."
            }

            $data = [IO.File]::ReadAllBytes($cacheFile)

            if ($data.Length -lt 29) {
              throw "Invalid encrypted Tailscale state."
            }

            $nonce = New-Object byte[] 12
            $tag = New-Object byte[] 16
            $cipher = New-Object byte[] ($data.Length - 28)

            [Buffer]::BlockCopy($data, 0, $nonce, 0, 12)
            [Buffer]::BlockCopy($data, 12, $tag, 0, 16)
            [Buffer]::BlockCopy($data, 28, $cipher, 0, $cipher.Length)

            $plain = New-Object byte[] $cipher.Length

            $aes = [Security.Cryptography.AesGcm]::new($key, 16)

            try {
              $aes.Decrypt($nonce, $cipher, $tag, $plain)
            }
            finally {
              $aes.Dispose()
            }

            [IO.File]::WriteAllBytes($stateFile, $plain)

            "TS_STATE_RESTORED=true" >> $env:GITHUB_ENV

            Write-Host "Tailscale identity restored."

          } else {

            Write-Host "No previous identity found. First-time registration."

            "TS_STATE_RESTORED=false" >> $env:GITHUB_ENV
          }

          Start-Service -Name Tailscale
          Start-Sleep -Seconds 5

      # Establish Tailscale connection
      - name: Establish Tailscale Connection
        shell: pwsh
        env:
          TAILSCALE_AUTH_KEY: ${{ secrets.TAILESCALE_AUTH_KEY }}
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"

          if (-not (Test-Path $ts)) {
            throw "Tailscale executable not found."
          }

          if ($env:TS_STATE_RESTORED -eq "true") {

            Write-Host "Connecting with restored identity..."

            & $ts up `
              --hostname=gh-runner-rdp `
              --unattended

          } else {

            Write-Host "Registering new Tailscale identity..."

            if (-not $env:TAILSCALE_AUTH_KEY) {
              throw "TAILESCALE_AUTH_KEY is missing."
            }

            & $ts up `
              "--authkey=$env:TAILSCALE_AUTH_KEY" `
              --hostname=gh-runner-rdp `
              --unattended
          }

          if ($LASTEXITCODE -ne 0) {
            throw "Tailscale connection failed."
          }

          $tsIP = $null

          for ($i = 0; $i -lt 30; $i++) {

            $tsIP = (& $ts ip -4 | Select-Object -First 1).Trim()

            if ($tsIP -match '^100\.') {
              break
            }

            Start-Sleep -Seconds 3
          }

          if (-not $tsIP -or $tsIP -notmatch '^100\.') {
            throw "Tailscale IP assignment failed."
          }

          "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

          Write-Host "Tailscale IP: $tsIP"

      # Configure Windows RDP
      - name: Configure RDP
        shell: pwsh
        run: |
          # Enable Remote Desktop
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name fDenyTSConnections `
            -Value 0

          # Disable Network Level Authentication
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name UserAuthentication `
            -Value 0

          # Use TLS security layer
          Set-ItemProperty `
            -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name SecurityLayer `
            -Value 1

          # Restrict RDP to Tailscale network
          Get-NetFirewallRule -DisplayGroup "Remote Desktop" |
            Disable-NetFirewallRule

          Get-NetFirewallRule -DisplayName "RDP-Tailscale-Only" `
            -ErrorAction SilentlyContinue |
            Remove-NetFirewallRule

          New-NetFirewallRule `
            -DisplayName "RDP-Tailscale-Only" `
            -Direction Inbound `
            -Protocol TCP `
            -LocalPort 3389 `
            -RemoteAddress 100.64.0.0/10 `
            -Action Allow `
            -Profile Any

          Set-Service -Name TermService -StartupType Automatic

          Restart-Service -Name TermService -Force

          Write-Host "RDP configured successfully."

      # Create RDP account
      - name: Create RDP User
        shell: pwsh
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          if (-not [string]::IsNullOrEmpty($env:RDP_PASSWORD)) {

            $password = $env:RDP_PASSWORD
            $showPassword = $false

            Write-Host "Using configured RDP password from GitHub Secret."

          } else {

            $chars = (
              'ABCDEFGHJKLMNPQRSTUVWXYZ' +
              'abcdefghijkmnopqrstuvwxyz' +
              '23456789' +
              '!@#$%^&*()-_=+'
            ).ToCharArray()

            $password = -join (
              1..24 | ForEach-Object {
                $chars[(Get-Random -Maximum $chars.Length)]
              }
            )

            $showPassword = $true

            Write-Host "No RDP_PASSWORD secret found. Generated a new password."
          }

          $securePass = ConvertTo-SecureString `
            $password -AsPlainText -Force

          $existingUser = Get-LocalUser `
            -Name "RDP" `
            -ErrorAction SilentlyContinue

          if ($existingUser) {

            Set-LocalUser -Name "RDP" -Password $securePass
            Enable-LocalUser -Name "RDP"

          } else {

            New-LocalUser `
              -Name "RDP" `
              -Password $securePass `
              -AccountNeverExpires
          }

          Add-LocalGroupMember `
            -Group "Administrators" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          Add-LocalGroupMember `
            -Group "Remote Desktop Users" `
            -Member "RDP" `
            -ErrorAction SilentlyContinue

          if ($showPassword) {
            "RDP_GENERATED_PASSWORD=$password" >> $env:GITHUB_ENV
          }

          $user = Get-LocalUser -Name "RDP"

          if (-not $user.Enabled) {
            throw "RDP account is disabled."
          }

          Write-Host "RDP account created/configured successfully."
          Write-Host "RDP account enabled: $($user.Enabled)"

          @"
          ## RDP ACCESS

          Address: $env:TAILSCALE_IP
          Username: RDP
          Password: $(if ($showPassword) { $password } else { '[Stored in GitHub Secret]' })
          "@ | Out-File $env:GITHUB_STEP_SUMMARY -Append

      # Verify RDP connection
      - name: Verify RDP
        shell: pwsh
        run: |
          Write-Host "Testing RDP connection..."

          $result = Test-NetConnection `
            -ComputerName $env:TAILSCALE_IP `
            -Port 3389 `
            -WarningAction SilentlyContinue

          if (-not $result.TcpTestSucceeded) {
            throw "RDP connection test failed."
          }

          Write-Host "RDP connection successful!"

      # Encrypt and save Tailscale identity
      - name: Save Tailscale Identity
        shell: pwsh
        env:
          STATE_KEY: ${{ secrets.TAILSCALE_STATE_KEY }}
        run: |
          $stateDir = "$env:ProgramData\Tailscale"

          $candidates = @(
            "$stateDir\tailscaled.state",
            "$stateDir\server-state.conf"
          )

          $stateFile = $candidates |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $stateFile) {
            throw "Tailscale state file not found."
          }

          if (-not $env:STATE_KEY) {
            throw "TAILSCALE_STATE_KEY is missing."
          }

          try {
            $key = [Convert]::FromBase64String($env:STATE_KEY)
          }
          catch {
            throw "TAILSCALE_STATE_KEY is not valid Base64."
          }

          if ($key.Length -ne 32) {
            throw "Invalid state encryption key."
          }

          Start-Sleep -Seconds 3

          $plain = [IO.File]::ReadAllBytes($stateFile)

          $nonce = New-Object byte[] 12
          $tag = New-Object byte[] 16
          $cipher = New-Object byte[] $plain.Length

          [Security.Cryptography.RandomNumberGenerator]::Fill($nonce)

          $aes = [Security.Cryptography.AesGcm]::new($key, 16)

          try {
            $aes.Encrypt($nonce, $plain, $cipher, $tag)
          }
          finally {
            $aes.Dispose()
          }

          $output = New-Object byte[] (28 + $cipher.Length)

          [Buffer]::BlockCopy($nonce, 0, $output, 0, 12)
          [Buffer]::BlockCopy($tag, 0, $output, 12, 16)
          [Buffer]::BlockCopy($cipher, 0, $output, 28, $cipher.Length)

          $cacheDir = "$env:RUNNER_TEMP\tailscale-cache"

          New-Item -ItemType Directory -Path $cacheDir -Force |
            Out-Null

          [IO.File]::WriteAllBytes(
            "$cacheDir\tailscale-state.enc",
            $output
          )

          Write-Host "Encrypted Tailscale identity saved."

      # Persist Tailscale state
      - name: Persist Tailscale State
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}\tailscale-cache
          key: tailscale-state-${{ github.run_id }}

      # Maintain RDP connection
      - name: Maintain Connection
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "========== RDP ACTIVE =========="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: RDP"

          if ($env:RDP_GENERATED_PASSWORD) {
            Write-Host "Password: $env:RDP_GENERATED_PASSWORD"
          }

          Write-Host "================================"

          while ($true) {
            Write-Host "[$(Get-Date)] RDP is active."
            Start-Sleep -Seconds 300
          }
